# Builds a universal TeamsAwake.app and publishes it as a GitHub release.
#
# Trigger: push a tag like v1.2.0.
#     git tag v1.2.0 && git push origin v1.2.0
#
# The app is signed ad-hoc and not notarised (that needs a paid Apple Developer
# account), so the README documents the Gatekeeper step downloaders will see.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Nothing gets write access by default; the single job below asks for exactly
# what it needs.
permissions: {}

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write        # create the release and attach files
    steps:
      # Pinned to a full commit SHA rather than a movable tag. This is the only
      # third-party action used; the release itself is made with the preinstalled gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Unit tests
        run: ./scripts/test.sh

      - name: Build universal app
        env:
          TAG: ${{ github.ref_name }}      # via env, never interpolated into the script
          TEAMSAWAKE_ADHOC: '1'
        run: |
          export TEAMSAWAKE_VERSION="${TAG#v}"
          ./scripts/build.sh

      - name: Check the build is what we are about to ship
        env:
          TAG: ${{ github.ref_name }}
        run: |
          BIN=build/TeamsAwake.app/Contents/MacOS/TeamsAwake
          ARCHS="$(lipo -archs "$BIN")"
          echo "architectures: $ARCHS"
          # build.sh quietly falls back to one architecture; a release must not.
          case "$ARCHS" in *arm64*) ;; *) echo "missing arm64"; exit 1 ;; esac
          case "$ARCHS" in *x86_64*) ;; *) echo "missing x86_64"; exit 1 ;; esac
          VER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/TeamsAwake.app/Contents/Info.plist)"
          [ "$VER" = "${TAG#v}" ] || { echo "version $VER does not match tag $TAG"; exit 1; }
          codesign --verify --strict build/TeamsAwake.app

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          # ditto, not zip: it preserves the signature and bundle metadata.
          ditto -c -k --keepParent build/TeamsAwake.app "dist/TeamsAwake-${TAG}.zip"
          (cd dist && shasum -a 256 "TeamsAwake-${TAG}.zip" > "TeamsAwake-${TAG}.zip.sha256")
          cat "dist/TeamsAwake-${TAG}.zip.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            "dist/TeamsAwake-${TAG}.zip" \
            "dist/TeamsAwake-${TAG}.zip.sha256" \
            --title "TeamsAwake ${TAG}" \
            --generate-notes \
            --verify-tag
